name: Build Installable Android APK (CyberNews CN)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install

      - name: Fix Compose Compiler 1.5.14 for Kotlin 1.9.24 and Prebuild
        run: |
          find node_modules -name "build.gradle*" -exec sed -i 's/1.5.15/1.5.14/g' {} +
          CI=1 npx expo prebuild --platform android --no-install --clean
          sed -i 's/1.5.15/1.5.14/g' android/build.gradle || true

      - name: Build Standalone Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberNews-CN-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
